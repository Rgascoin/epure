# After each successful production deployment on Vercel, tell Bing & co.
# which recipes changed (scripts/indexnow.mjs).
name: IndexNow

on:
  deployment_status:

permissions:
  contents: read

jobs:
  ping:
    if: >-
      github.event.deployment_status.state == 'success' &&
      startsWith(github.event.deployment.environment, 'Production')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.deployment.sha }}
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/indexnow.mjs --since HEAD~1
